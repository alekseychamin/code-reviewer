services:
  api:
    build:
      context: .
      dockerfile: src/TfsReviewPlatform.Api/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_DEVOPS_TOKEN=${AZURE_DEVOPS_TOKEN:-}
      - ProviderCatalog__Profiles__1__BaseUrl=${LOCAL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL-}
      - VITE_DEV_PROXY_TARGET=${VITE_DEV_PROXY_TARGET:-http://api:8080}
    ports:
      - "5173:5173"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    env_file:
      - .env
    ports:
      - "11434:11434"
    profiles:
      - local-llm
