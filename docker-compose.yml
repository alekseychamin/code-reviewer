services:
  api:
    build:
      context: .
      dockerfile: src/TfsReviewPlatform.Api/Dockerfile
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_DEVOPS_TOKEN=${AZURE_DEVOPS_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - ConnectionStrings__ReviewHistory=${POSTGRES_CONNECTION_STRING:-}
      - ProviderCatalog__Profiles__1__BaseUrl=${LOCAL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - REPOSITORIES_ROOT=${CONTAINER_REPOSITORIES_ROOT:-/workspace/repos}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ${HOST_REPOSITORIES_ROOT}:${CONTAINER_REPOSITORIES_ROOT:-/workspace/repos}:ro

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL-}
      - VITE_DEV_PROXY_TARGET=${VITE_DEV_PROXY_TARGET:-http://api:8080}
    ports:
      - "5173:5173"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    env_file:
      - .env
    ports:
      - "11434:11434"
    profiles:
      - local-llm

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tfs_review}
      - POSTGRES_USER=${POSTGRES_USER:-tfs_review}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tfs_review}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - history-db

volumes:
  postgres-data:
