services:
  api:
    build:
      context: .
      dockerfile: src/TfsReviewPlatform.Api/Dockerfile
      args:
        NUGET_INTERNAL_FEED_URL: ${NUGET_INTERNAL_FEED_URL:-}
        NUGET_INTERNAL_FEED_USERNAME: ${NUGET_INTERNAL_FEED_USERNAME:-}
        NUGET_INTERNAL_FEED_PASSWORD: ${NUGET_INTERNAL_FEED_PASSWORD:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ReviewHistory=${POSTGRES_CONNECTION_STRING:-}
      - ProviderCatalog__Profiles__1__BaseUrl=${LOCAL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - REPOSITORIES_ROOT=${CONTAINER_REPOSITORIES_ROOT:-/workspace/repos}
      - Qdrant__Enabled=${QDRANT_ENABLED:-false}
      - Qdrant__Url=${QDRANT_URL:-http://qdrant:6333}
      - Qdrant__ApiKey=${QDRANT_API_KEY:-}
      - Qdrant__CollectionName=${QDRANT_COLLECTION_NAME:-review_semantic_index}
      - Qdrant__VectorSize=${QDRANT_VECTOR_SIZE:-1024}
      - Qdrant__TargetedTopK=${QDRANT_TARGETED_TOP_K:-4}
      - Qdrant__GeneralTopK=${QDRANT_GENERAL_TOP_K:-8}
      - Qdrant__HistoricalFindingHalfLifeDays=${QDRANT_HISTORICAL_FINDING_HALF_LIFE_DAYS:-45}
      - Qdrant__EmbeddingBaseUrl=${QDRANT_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      - Qdrant__EmbeddingModel=${QDRANT_EMBEDDING_MODEL:-bge-m3:latest}
      - QDRANT_MODE=${SOCRATICODE_QDRANT_MODE:-external}
      - OLLAMA_MODE=${SOCRATICODE_OLLAMA_MODE:-external}
      - OLLAMA_URL=${QDRANT_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      - EMBEDDING_MODEL=${SOCRATICODE_EMBEDDING_MODEL:-bge-m3:latest}
      - EMBEDDING_DIMENSIONS=${SOCRATICODE_EMBEDDING_DIMENSIONS:-1024}
      - Qdrant__CodeContextEnabled=${QDRANT_CODE_CONTEXT_ENABLED:-true}
      - Qdrant__CodeContextReuseExistingSnapshots=${QDRANT_CODE_CONTEXT_REUSE_EXISTING_SNAPSHOTS:-true}
      - Qdrant__CodeContextTimeoutSeconds=${QDRANT_CODE_CONTEXT_TIMEOUT_SECONDS:-90}
      - Qdrant__CodeContextTtlHours=${QDRANT_CODE_CONTEXT_TTL_HOURS:-168}
      - Qdrant__CodeContextCleanupIntervalMinutes=${QDRANT_CODE_CONTEXT_CLEANUP_INTERVAL_MINUTES:-60}
      - Qdrant__CodeContextMaxSourceFiles=${QDRANT_CODE_CONTEXT_MAX_SOURCE_FILES:-600}
      - Qdrant__CodeContextMaxTargetFiles=${QDRANT_CODE_CONTEXT_MAX_TARGET_FILES:-160}
      - Qdrant__CodeContextMaxFileBytes=${QDRANT_CODE_CONTEXT_MAX_FILE_BYTES:-120000}
      - Qdrant__CodeContextChunkMaxLines=${QDRANT_CODE_CONTEXT_CHUNK_MAX_LINES:-120}
      - Qdrant__CodeContextChunkOverlapLines=${QDRANT_CODE_CONTEXT_CHUNK_OVERLAP_LINES:-20}
      - Qdrant__CodeContextMaxQueries=${QDRANT_CODE_CONTEXT_MAX_QUERIES:-8}
      - Qdrant__CodeContextTopKPerQuery=${QDRANT_CODE_CONTEXT_TOP_K_PER_QUERY:-3}
      - Qdrant__CodeContextMaxSnippets=${QDRANT_CODE_CONTEXT_MAX_SNIPPETS:-10}
      - ReviewPipeline__Roslyn__Enabled=${REVIEW_ROSLYN_ENABLED:-true}
      - ReviewPipeline__Roslyn__RestoreTimeoutSeconds=${REVIEW_ROSLYN_RESTORE_TIMEOUT_SECONDS:-900}
      - ReviewPipeline__Roslyn__IncludeReferenceEdges=${REVIEW_ROSLYN_INCLUDE_REFERENCE_EDGES:-false}
      - ReviewPipeline__SinglePassFullDiffAndGraphPrimaryReview=${REVIEW_SINGLE_PASS_FULL_CONTEXT:-false}
      - ReviewPipeline__SinglePassFullContextMaxCharacters=${REVIEW_SINGLE_PASS_MAX_CHARS:-0}
      - ReviewPipeline__IncludeRoslynGraphInFullContextPayload=${REVIEW_INCLUDE_ROSLYN_GRAPH_IN_FULL_CONTEXT:-true}
      - ReviewPipeline__MaxChunkToolRequests=${REVIEW_MAX_CHUNK_TOOL_REQUESTS:-1}
      - ReviewPipeline__FullContextMaxToolIterations=${REVIEW_FULL_CONTEXT_MAX_TOOL_ITERATIONS:-2}
      - ReviewPipeline__EnableDeterministicCoverageCritic=${REVIEW_DETERMINISTIC_COVERAGE_CRITIC:-true}
      - ReviewPipeline__EnableFinalModelNormalizationPass=${REVIEW_FINAL_MODEL_NORMALIZATION:-true}
      - ReviewPipeline__EnableFindingEvidenceGate=${REVIEW_FINDING_EVIDENCE_GATE:-true}
      - ReviewPipeline__UseExternalReviewScoutMode=${REVIEW_USE_EXTERNAL_SCOUT_MODE:-false}
      - ReviewPipeline__UseIncrementalReviewMode=${REVIEW_INCREMENTAL_MODE:-true}
      - ReviewPipeline__ExternalReviewScoutMaxCriticCharacters=${REVIEW_EXTERNAL_SCOUT_MAX_CRITIC_CHARS:-26000}
      - ReviewPipeline__MaxConcurrentExternalReviewScoutCritics=${REVIEW_EXTERNAL_SCOUT_MAX_CONCURRENCY:-3}
      - ExternalReview__Enabled=${EXTERNAL_REVIEW_ENABLED:-false}
      - ExternalReview__EngineName=${EXTERNAL_REVIEW_ENGINE_NAME:-PR-Agent}
      - ExternalReview__BaseUrl=${EXTERNAL_REVIEW_BASE_URL:-http://192.168.1.63:3005}
      - ExternalReview__InputMode=${EXTERNAL_REVIEW_INPUT_MODE:-PullRequestUrl}
      - ExternalReview__Commands__0=${EXTERNAL_REVIEW_COMMAND_0:-describe}
      - ExternalReview__Commands__1=${EXTERNAL_REVIEW_COMMAND_1:-}
      - ExternalReview__ResponseLanguage=${EXTERNAL_REVIEW_RESPONSE_LANGUAGE:-ru-ru}
      - ExternalReview__TimeoutSeconds=${EXTERNAL_REVIEW_TIMEOUT_SECONDS:-360}
      - ExternalReview__MaxWaitAtEndSeconds=${EXTERNAL_REVIEW_MAX_WAIT_AT_END_SECONDS:-10}
      - ExternalReview__UseChangeSummary=${EXTERNAL_REVIEW_USE_CHANGE_SUMMARY:-true}
      - ExternalReview__ChangeSummaryWaitSeconds=${EXTERNAL_REVIEW_CHANGE_SUMMARY_WAIT_SECONDS:-45}
      - ExternalReview__UseReviewFindings=${EXTERNAL_REVIEW_USE_REVIEW_FINDINGS:-false}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DeepSeekTuiReview__Enabled=${DEEPSEEK_TUI_REVIEW_ENABLED:-false}
      - DeepSeekTuiReview__UseAsPrimaryReviewer=${DEEPSEEK_TUI_USE_AS_PRIMARY:-false}
      - DeepSeekTuiReview__ExecutablePath=${DEEPSEEK_TUI_EXECUTABLE:-deepseek}
      - DeepSeekTuiReview__WorkspaceRoot=${DEEPSEEK_TUI_WORKSPACE_ROOT:-/review-workspaces}
      - DeepSeekTuiReview__UsePersistentRepositoryWorkspace=${DEEPSEEK_TUI_USE_PERSISTENT_REPOSITORY_WORKSPACE:-true}
      - DeepSeekTuiReview__RepositoryDirectoryName=${DEEPSEEK_TUI_REPOSITORY_DIRECTORY_NAME:-repositories}
      - DeepSeekTuiReview__TimeoutSeconds=${DEEPSEEK_TUI_TIMEOUT_SECONDS:-900}
      - DeepSeekTuiReview__Model=${DEEPSEEK_TUI_MODEL:-auto}
      - DeepSeekTuiReview__AutoApproveTools=${DEEPSEEK_TUI_AUTO_APPROVE_TOOLS:-true}
      - DeepSeekTuiReview__SocraticodePreflightEnabled=${DEEPSEEK_TUI_SOCRATICODE_PREFLIGHT_ENABLED:-true}
      - DeepSeekTuiReview__SocraticodeMcpCommand=${DEEPSEEK_TUI_SOCRATICODE_MCP_COMMAND:-npx}
      - DeepSeekTuiReview__SocraticodeMcpArguments=${DEEPSEEK_TUI_SOCRATICODE_MCP_ARGUMENTS:--y --loglevel=error socraticode@latest}
      - DeepSeekTuiReview__SocraticodePreflightTimeoutSeconds=${DEEPSEEK_TUI_SOCRATICODE_PREFLIGHT_TIMEOUT_SECONDS:-1800}
      - DeepSeekTuiReview__SocraticodePreflightPollIntervalSeconds=${DEEPSEEK_TUI_SOCRATICODE_PREFLIGHT_POLL_INTERVAL_SECONDS:-5}
      - DeepSeekTuiReview__SocraticodePreflightUpdateExistingIndex=${DEEPSEEK_TUI_SOCRATICODE_PREFLIGHT_UPDATE_EXISTING_INDEX:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ${HOST_REPOSITORIES_ROOT}:${CONTAINER_REPOSITORIES_ROOT:-/workspace/repos}:ro
      - deepseek-tui-home:/root/.deepseek
      - review-workspaces:/review-workspaces

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "11434:11434"
    profiles:
      - local-llm

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-tfs_review}
      - POSTGRES_USER=${POSTGRES_USER:-tfs_review}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tfs_review}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    profiles:
      - history-db

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    profiles:
      - semantic-index

volumes:
  postgres-data:
  qdrant-data:
  deepseek-tui-home:
  review-workspaces:
